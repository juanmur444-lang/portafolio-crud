{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'categorias/css/estilos.css' %}">
</head>
<body>
    <div class="contenedor">
        <h1>{{ titulo }}</h1>
        <form method="POST">
            {% csrf_token %}
            {{ formulario.as_p }}
            <button type="submit">Guardar</button>
        </form>
        <p style="margin-top:20px;"><a class="btn" href="{% url 'categorias:lista' %}">← Volver</a></p>
    </div>
</body>
</html>
