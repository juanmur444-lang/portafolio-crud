{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link rel="stylesheet" href="{% static 'categorias/css/estilos.css' %}">
</head>
<body>
    <div class="contenedor">
        <h1>Categorías de habilidades</h1>
        <a class="btn" href="{% url 'categorias:crear' %}">+ Nueva categoría</a>
        <table>
            <tr><th>Nombre</th><th>Acciones</th></tr>
            {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td class="acciones">
                    <a href="{% url 'categorias:editar' categoria.id %}">Editar</a>
                    <a class="eliminar" href="{% url 'categorias:eliminar' categoria.id %}">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Todavía no hay categorías.</td></tr>
            {% endfor %}
        </table>
        <p style="margin-top:20px;"><a class="btn" href="{% url 'proyectos:lista' %}">Ver proyectos →</a></p>
    </div>
</body>
</html>
